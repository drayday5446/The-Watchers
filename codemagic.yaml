workflows:
  watchers-debug:
    name: The Watchers debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Create Gradle wrapper
        script: |
          mkdir -p /tmp/wrap && cd /tmp/wrap
          gradle wrapper --gradle-version 8.7 --distribution-type bin
          cp -r gradle gradlew gradlew.bat "$CM_BUILD_DIR"/
          chmod +x "$CM_BUILD_DIR/gradlew"
      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR"
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
